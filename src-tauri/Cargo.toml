[package]
name = "aid-c2s"
version = "5.0.0"
description = "AID-C2S synthetic aerial threat simulation trainer"
authors = ["AID-C2S Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
tauri = { version = "2.12.0" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
