<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:13px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{background-image:radial-gradient(ellipse at 60% -15%,rgba(255,255,255,.10),transparent 34%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:auto,38px 38px,38px 38px;background-attachment:fixed}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid white;outline-offset:2px}button:disabled{opacity:.35;cursor:not-allowed}.app{min-height:100vh;display:grid;grid-template-columns:205px minmax(0,1fr)}.side{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line);background:rgba(7,8,9,.90);backdrop-filter:blur(18px);display:flex;flex-direction:column;z-index:3}.brand{display:flex;gap:10px;align-items:center;padding:8px 6px 18px}.brand-mark{width:36px;height:36px;border:1px solid var(--line2);display:grid;place-items:center;background:linear-gradient(135deg,#333,#0e0e10);font-size:18px}.brand strong{display:block;font-size:13px;letter-spacing:.16em}.brand small{display:block;color:var(--dim);font-size:8px;letter-spacing:.15em;margin-top:3px}.live{padding:9px;border:1px solid var(--line);background:var(--panel2);font-size:9px;letter-spacing:.12em;display:flex;justify-content:space-between;margin:0 0 18px}.live b{font-weight:600;color:#fff}.nav-label{padding:8px 8px 6px;color:var(--dim);font-size:8px;letter-spacing:.19em}.nav{display:grid;gap:3px}.nav button{border:1px solid transparent;background:transparent;text-align:left;padding:10px 9px;display:flex;gap:10px;align-items:center;color:#96979c;border-radius:3px;font-size:11px}.nav button .ico{width:17px;color:#babcc1;text-align:center;font-size:13px}.nav button.active,.nav button:hover{background:rgba(255,255,255,.065);border-color:var(--line2);color:white;box-shadow:inset 2px 0 white}.side-bottom{margin-top:auto}.profile-mini{border-top:1px solid var(--line);padding:13px 5px 4px;display:flex;gap:9px;align-items:center}.avatar{width:29px;height:29px;border:1px solid var(--line2);display:grid;place-items:center;background:#17181b}.profile-mini b{display:block;font-size:10px}.profile-mini small{color:var(--dim);font-size:9px}.content{min-width:0}.top{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(9,10,11,.75);position:sticky;top:0;z-index:2;backdrop-filter:blur(16px)}.crumb{font:9px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.15em;color:#ccc}.crumb span{color:var(--dim);padding:0 7px}.telemetry{display:flex;gap:14px;align-items:center;font:8px ui-monospace,monospace;color:#85878d;letter-spacing:.07em}.dot{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}.page{max-width:1600px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;margin-bottom:19px}.eyebrow,.label{font:9px ui-monospace,monospace;letter-spacing:.17em;color:#888b91;text-transform:uppercase}.head h1{font-size:clamp(25px,3vw,37px);font-weight:530;letter-spacing:-.045em;margin:7px 0 4px}.head p{margin:0;color:var(--muted);max-width:690px;line-height:1.65}.glass{border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,255,255,.018));backdrop-filter:blur(18px);box-shadow:0 16px 45px #0005,inset 0 1px #ffffff04;border-radius:var(--radius);min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line);font:9px ui-monospace,monospace;letter-spacing:.13em;color:#bfc0c4;text-transform:uppercase}.panel-body{padding:14px}.btn{border:1px solid var(--line2);background:rgba(255,255,255,.05);padding:9px 12px;min-height:35px;border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.04em;transition:.15s}.btn:hover{background:rgba(255,255,255,.13);border-color:#777}.btn.primary{background:#f3f3f4;color:#08090b;border-color:#fff}.btn.ghost{background:transparent}.btn.small{min-height:29px;padding:6px 9px;font-size:9px}.btn-row{display:flex;gap:7px;flex-wrap:wrap}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.metric{padding:14px}.metric .label{font-size:8px}.metric strong{display:block;font-size:28px;font-weight:530;letter-spacing:-.05em;margin:10px 0 3px}.metric small{color:var(--muted);font-size:10px}.positive{color:#e6e6e8}.negative{color:#bdbdc1}.rows{display:grid;gap:8px}.rowitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);background:#ffffff03}.rowitem b{font-size:11px;font-weight:550}.rowitem small{display:block;color:var(--muted);margin-top:3px;font-size:10px}.tag{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line2);padding:3px 6px;font:8px ui-monospace,monospace;letter-spacing:.08em;color:#ddd;border-radius:2px;white-space:nowrap}.muted{color:var(--muted)}.dim{color:var(--dim)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.spacer{height:12px}.notice{padding:12px 14px;border:1px solid var(--line2);background:rgba(255,255,255,.035);color:#c1c2c6;font-size:11px;line-height:1.6}.command-hero{padding:24px;min-height:215px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 85% 40%,#ffffff11,transparent 45%),linear-gradient(120deg,#151619,#090a0c)}.command-hero:after{content:"";position:absolute;width:250px;height:250px;border:1px solid #ffffff12;border-radius:50%;right:3%;top:-25%;box-shadow:0 0 0 35px #ffffff05,0 0 0 75px #ffffff03;pointer-events:none}.command-hero h2{font-size:clamp(24px,3vw,36px);font-weight:500;letter-spacing:-.05em;margin:14px 0 9px;max-width:560px;position:relative;z-index:1}.command-hero p{max-width:610px;color:#aaa;line-height:1.7;position:relative;z-index:1}.training-grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,.8fr);gap:12px}.world-wrap{position:relative;min-height:370px;background:#070809;overflow:hidden}.world-wrap canvas{width:100%;height:100%;min-height:370px;display:block}.world-hud{position:absolute;left:12px;right:12px;top:11px;display:flex;justify-content:space-between;gap:10px;font:8px ui-monospace,monospace;letter-spacing:.12em;color:#bfc0c3;pointer-events:none}.world-foot{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;font:8px ui-monospace,monospace;color:#8d8f94;pointer-events:none}.trackrow{border:1px solid var(--line);padding:9px 10px;margin-bottom:6px;background:#ffffff02;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}.trackrow:hover,.trackrow.selected{background:#ffffff0c;border-color:#aaa}.trackrow .id{font:10px ui-monospace,monospace}.trackrow small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.signal{height:4px;background:#333;margin-top:6px;overflow:hidden}.signal span{display:block;height:100%;background:#eee}.formrow{display:grid;gap:6px;margin-bottom:13px}.formrow label{font-size:10px;color:#b6b8bc}.formrow select,.formrow input[type=text],.formrow input[type=number]{width:100%;background:#0d0e10;border:1px solid var(--line2);color:#f4f4f5;padding:10px;border-radius:3px}.formrow input[type=range]{width:100%;accent-color:#fff}.choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.choice{padding:11px 7px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:10px;text-align:center}.choice.active{background:#eee;color:#08090b;border-color:#fff}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line)}.table th{font:8px ui-monospace,monospace;color:#909197;letter-spacing:.1em}.bars{display:grid;gap:11px}.barrow{display:grid;grid-template-columns:92px 1fr 35px;gap:9px;align-items:center;font-size:10px}.bar{height:7px;background:#ffffff10;border:1px solid #ffffff09}.bar span{display:block;height:100%;background:#ddd}.timeline{position:relative;padding-left:23px;display:grid;gap:11px}.timeline:before{content:"";position:absolute;top:4px;bottom:4px;left:7px;width:1px;background:#ffffff22}.event{position:relative;padding:0 0 9px;border-bottom:1px solid #ffffff0b}.event:before{content:"";position:absolute;left:-20px;top:3px;width:6px;height:6px;border:1px solid white;background:#111;border-radius:50%}.event b{font-size:10px;font-weight:550}.event small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.mobile-nav{display:none}.footer-note{font-size:9px;color:#6f7176;padding:18px 0 5px;line-height:1.6}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line)}.pill{display:inline-block;border:1px solid var(--line);padding:4px 7px;color:#ddd;font:8px ui-monospace,monospace;letter-spacing:.08em}.divider{height:1px;background:var(--line);margin:12px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:20;background:#f4f4f4;color:#090a0b;padding:10px 14px;border-radius:4px;box-shadow:0 8px 30px #0008;font-size:11px;font-weight:600;max-width:90vw}.video-canvas{width:100%;display:block;aspect-ratio:16/9;background:#08090a}.small-foot{font-size:9px;color:#74767c;line-height:1.6}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.top{height:43px;padding:0 13px}.telemetry{gap:7px;font-size:7px}.telemetry span:nth-child(2){display:none}.page{padding:14px 12px 85px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;padding:6px 5px calc(6px + env(safe-area-inset-bottom));background:rgba(8,9,11,.94);border-top:1px solid var(--line2);backdrop-filter:blur(22px);overflow-x:auto;gap:4px;scrollbar-width:none}.mobile-nav button{flex:0 0 auto;min-width:61px;padding:7px 6px;border:1px solid transparent;background:transparent;color:#9b9ca1;font-size:8px;display:grid;gap:3px;justify-items:center}.mobile-nav button .ico{font-size:15px}.mobile-nav button.active{color:white;border-color:var(--line2);background:#ffffff0b}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.training-grid{grid-template-columns:1fr}.world-wrap,.world-wrap canvas{min-height:270px}.head{align-items:flex-start;flex-direction:column;margin-bottom:14px}.head .btn-row{width:100%}.head .btn-row .btn{flex:1}.command-hero{padding:18px;min-height:0}.command-hero:after{right:-100px}.metric{padding:11px}.metric strong{font-size:23px}.hide-mobile{display:none!important}.panel-body{padding:11px}.table{min-width:480px}.table-scroll{overflow-x:auto}.choice-grid{gap:5px}.choice{font-size:9px;padding:10px 4px}}
@media(max-width:400px){.g2,.g3{grid-template-columns:1fr}.telemetry span:nth-child(3){display:none}.world-wrap,.world-wrap canvas{min-height:245px}.page{padding-left:9px;padding-right:9px}.head h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="brand-mark">◈</div><div><strong>AID-C2S</strong><small>SIMULATION TRAINER / V5.0</small></div></div>
  <div class="live"><span>TRAINING FABRIC</span><b>LOCAL / ACTIVE</b></div>
  <div class="nav-label">WORKSPACE</div><nav class="nav" id="desktopNav"></nav>
  <div class="side-bottom"><div class="profile-mini"><div class="avatar">E</div><div><b id="profileLabel">DEMO OPERATOR</b><small>LOCAL TRAINING PROFILE</small></div></div><div class="small-foot">SYNTHETIC ENVIRONMENT<br>OFFLINE-READY PHONE DEMO</div></div>
</aside>
<main class="content">
  <header class="top"><div class="crumb">AID-C2S <span>//</span> <b id="crumb">COMMAND</b></div><div class="telemetry"><span id="clock">--:--:--</span><span>V4 / PHONE DEMO</span><span>LOCAL-FIRST</span><i class="dot"></i></div></header>
  <div id="view" class="page"></div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div id="toast" hidden class="toast"></div>
<input id="scenarioImport" type="file" accept="application/json,.json" hidden>
<input id="backupImport" type="file" accept="application/json,.json" hidden>
<script>
(()=>{
'use strict';
const navItems=[
 ['command','⌂','Command'],['training','◎','Training'],['tracking','⌖','Tracking'],['fusion','⌁','Fusion'],['scenario','◫','Scenario Lab'],['media','▧','Media'],['aar','◷','AAR / Replay'],['history','☷','History'],['analytics','▥','Analytics'],['unit','▤','Unit Stats'],['system','⚙','System'],['help','?','Help']
];
const $=s=>document.querySelector(s);
const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=0)=>Number(v||0).toFixed(d);
const uid=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const now=()=>new Date().toISOString();
let activeTab=location.hash.replace(/^#\/?/,'')||'command';
let toastTimer;
const memoryStore=new Map();
const read=(k,f)=>{try{const raw=localStorage.getItem('aidc2s-phone-'+k);if(raw!==null){const value=JSON.parse(raw);memoryStore.set(k,value);return value}}catch{}return memoryStore.has(k)?memoryStore.get(k):f};
const write=(k,v)=>{memoryStore.set(k,v);try{localStorage.setItem('aidc2s-phone-'+k,JSON.stringify(v))}catch{ /* Opaque/file URL browsers still get in-session memory storage. */ }};
const initialScenario={id:'SCN-DEMO-042',name:'URBAN / NIGHT / LOW VISIBILITY',seed:784291,environment:'URBAN',time:'NIGHT',visibility:42,sensorHealth:64,count:12,ambiguity:55,difficulty:'ADAPTIVE',duration:180};
const state={
 tab:navItems.some(x=>x[0]===activeTab)?activeTab:'command',
 profile:read('profile','DEMO OPERATOR'),
 scenario:read('scenario',initialScenario),
 scenarios:read('scenarios',[]),
 sessions:read('sessions',[]),
 running:false,paused:false,elapsed:0,lastTick:performance.now(),
 tracks:[],selected:null,answers:{},events:[],classification:'UNKNOWN / AMBIGUOUS',confidence:.72,decision:'MONITOR',
 sensor:'SYNTHETIC RADAR',replayPos:0,mediaPlaying:true,mediaTime:0,filter:'ALL',search:''
};
function rng(seed){let s=(Number(seed)||1)>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
function genTracks(scn){
 const r=rng(scn.seed),n=Math.max(4,Math.min(32,Number(scn.count)||12));
 const truthOptions=['BENIGN','UNKNOWN','UNUSUAL'];
 return Array.from({length:n},(_,i)=>{
   const actual=truthOptions[Math.floor(r()*truthOptions.length)];
   const x=(r()-.5)*1.65,z=(r()-.5)*1.65;
   return {id:`T-${String(i+1).padStart(3,'0')}`,x,z,vx:(r()-.5)*.035,vz:(r()-.5)*.035,confidence:Math.round(45+r()*50),actual,expected:actual==='BENIGN'?'RESOLVE':actual==='UNUSUAL'?'ESCALATE':'MONITOR',status:'TRACKING',age:Math.floor(r()*40),seen:true,history:[],acquired:false};
 });
}
state.tracks=genTracks(state.scenario);state.selected=state.tracks[0]?.id||null;
function event(type,detail=''){state.events.push({t:Math.round(state.elapsed),type,detail});}
function saveState(){write('profile',state.profile);write('scenario',state.scenario);write('scenarios',state.scenarios);write('sessions',state.sessions)}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2400)}
function go(tab){if(!navItems.some(n=>n[0]===tab))return;state.tab=tab;location.hash='/'+tab;render();window.scrollTo({top:0,behavior:'smooth'})}
function navHTML(){return navItems.map(([id,ico,label])=>`<button type="button" data-tab="${id}" class="${state.tab===id?'active':''}"><span class="ico">${ico}</span><span>${label}</span></button>`).join('')}
function head(title,sub,actions=''){return `<div class="head"><div><div class="eyebrow">AID-C2S / V5.0 / LOCAL TRAINING FABRIC</div><h1>${title}</h1><p>${sub}</p></div>${actions?`<div class="btn-row">${actions}</div>`:''}</div>`}
function panel(title,body,extra=''){return `<section class="glass"><div class="panel-head"><span>${title}</span>${extra}</div><div class="panel-body">${body}</div></section>`}
function metric(label,value,sub){return `<div class="glass metric"><div class="label">${label}</div><strong>${value}</strong><small>${sub}</small></div>`}
function btn(action,label,kind='',attrs=''){return `<button type="button" class="btn ${kind}" data-action="${action}" ${attrs}>${label}</button>`}
function stats(){const sessions=state.sessions;const avg=sessions.length?Math.round(sessions.reduce((a,s)=>a+s.score.overall,0)/sessions.length):0;return {sessions:sessions.length,avg,best:sessions.length?Math.max(...sessions.map(s=>s.score.overall)):0,last:sessions[0]}}
function commandView(){
 const st=stats(),last=st.last;
 return head('Command overview','A local-first synthetic training workspace. Ground truth remains hidden during training; scoring is deterministic and AI-independent.',
 `<button class="btn primary" data-action="start">▶ START TRAINING</button><button class="btn" data-tab="scenario">SCENARIO LAB ↗</button>`) +
 `<div class="glass command-hero"><div class="eyebrow">SYNTHETIC TRAINING ENVIRONMENT / READY</div><h2>Measure decisions.<br>Replay every moment.</h2><p>Procedural scenarios, uncertain observations, track continuity, and explainable after-action review — available locally on this device.</p><div class="btn-row"><button class="btn primary" data-action="start">START DEMO SESSION</button><button class="btn" data-tab="help">VIEW SYSTEM GUIDE</button></div></div><div class="spacer"></div>
 <div class="grid g4">${metric('SAVED SESSIONS',st.sessions,st.sessions?'Persisted locally':'No sessions yet')}${metric('MEAN SCORE',st.sessions?st.avg+'%':'—',st.sessions?'Across saved sessions':'Finish a session to calculate')}${metric('PERSONAL BEST',st.sessions?st.best+'%':'—','Deterministic score')}${metric('TRACKS IN CURRENT SCENARIO',state.tracks.length,state.scenario.environment+' / '+state.scenario.time)}</div><div class="spacer"></div>
 <div class="grid g2">${panel('CURRENT SCENARIO',`<div class="eyebrow">${safe(state.scenario.id)}</div><h2 style="font-weight:500;margin:10px 0">${safe(state.scenario.name)}</h2><div class="grid g2">${mini('SEED',state.scenario.seed)}${mini('DIFFICULTY',state.scenario.difficulty)}${mini('VISIBILITY',state.scenario.visibility+'%')}${mini('SENSOR HEALTH',state.scenario.sensorHealth+'%')}</div><div class="spacer"></div><div class="btn-row"><button class="btn primary" data-action="start">RUN SCENARIO</button><button class="btn" data-tab="scenario">EDIT SCENARIO</button></div>`,'DNA / READY'),
 panel('LATEST AFTER-ACTION REVIEW',last?`<div class="rowitem"><div><b>${safe(last.scenarioName)}</b><small>${new Date(last.finishedAt).toLocaleString()}</small></div><strong>${last.score.overall}%</strong></div><div class="spacer"></div><div class="btn-row"><button class="btn primary" data-action="open-aar" data-id="${last.id}">OPEN AAR</button><button class="btn" data-tab="history">SESSION HISTORY</button></div>`:`<div class="empty">No completed session yet.<br><br><button class="btn primary" data-action="start">Run first session</button></div>`,'PERSISTED DATA')}</div><div class="spacer"></div>
 <div class="grid g2">${panel('NEXT TRAINING SUGGESTION',`<div class="rowitem"><div><b>${state.scenario.visibility<50?'Clearer visibility, increased ambiguity':'Reduced visibility with sensor uncertainty'}</b><small>Suggested from current scenario settings; recommendations remain local and deterministic.</small></div><span class="tag">ADAPTIVE</span></div><div class="spacer"></div><button class="btn" data-action="adaptive">GENERATE NEXT SCENARIO →</button>`)}${panel('SYSTEM STATUS',`<div class="rows"><div class="rowitem"><span>Simulation</span><span class="tag">SYNTHETIC / ACTIVE</span></div><div class="rowitem"><span>Persistence</span><span class="tag">${storageStatus()}</span></div><div class="rowitem"><span>Network dependency</span><span class="tag">NONE FOR DEMO</span></div><div class="rowitem"><span>Phone mode</span><span class="tag">CANVAS</span></div></div>`)} </div>`;
}
function mini(k,v){return `<div><div class="label">${k}</div><div style="font-size:14px;margin-top:5px">${safe(v)}</div></div>`}
function storageStatus(){try{localStorage.setItem('aidc2s-test','1');localStorage.removeItem('aidc2s-test');return 'LOCAL OK'}catch{return 'LIMITED'}}
function trackRows(limit=20){return state.tracks.slice(0,limit).map(t=>`<div class="trackrow ${state.selected===t.id?'selected':''}" data-select="${t.id}" tabindex="0" role="button"><div><div class="id">${t.id} <span class="tag">${t.status}</span></div><small>${t.acquired?'ACQUIRED':'UNCLASSIFIED'} / ${t.age}s / ${t.seen?'LINKED':'LAST KNOWN'}</small><div class="signal"><span style="width:${t.confidence}%"></span></div></div><b class="mono">${t.confidence}%</b></div>`).join('')}
function selectedTrack(){return state.tracks.find(t=>t.id===state.selected)||state.tracks[0]}
function trainingView(){
 const t=selectedTrack();
 return head('Live training','Synthetic contacts and evidence are intentionally uncertain. Acquire a track, review the observations, classify, set confidence, and submit an abstract training decision.',
 `<button class="btn" data-action="reset-scenario">↺ RESET</button><button class="btn primary" data-action="${state.paused?'resume':state.running?'pause':'start'}">${state.paused?'▶ RESUME':state.running?'Ⅱ PAUSE':'▶ START'}</button>`) +

function drawWorld(canvas,mode='world'){

 c.clearRect(0,0,W,H);c.fillStyle='#08090b';c.fillRect(0,0,W,H);
 if(mode==='evidence'){
   c.fillStyle='#0c0e10';c.fillRect(0,0,W,H);
   for(let y=0;y<H;y+=4){c.fillStyle=`rgba(255,255,255,${y%8===0?.045:.018})`;c.fillRect(0,y,W,1)}
   for(let i=0;i<50;i++){let x=(i*83+t*18)%W,y=(i*39+Math.sin(t+i)*13)%H;c.fillStyle=`rgba(255,255,255,${.06+(i%4)*.025})`;c.fillRect(x,y,1.4,1.4)}
   const cx=W*.51,cy=H*.53,rad=Math.min(W,H)*.28;
   c.strokeStyle='#ffffff22';c.lineWidth=1;for(let i=1;i<=3;i++){c.beginPath();c.arc(cx,cy,rad*i/3,0,Math.PI*2);c.stroke()}
   c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(t*.8)*rad,cy+Math.sin(t*.8)*rad);c.strokeStyle='#fff9';c.stroke();
   state.tracks.slice(0,14).forEach((tr,i)=>{let x=cx+tr.x*rad*.7,y=cy+tr.z*rad*.7;c.beginPath();c.arc(x,y,2.4+(i%3),0,Math.PI*2);c.strokeStyle=i===0?'#fff':'#c6c6c655';c.stroke()});
   c.fillStyle='#eeeeee';c.font='9px monospace';c.fillText(`${state.sensor} / SIM FEED`,9,14);c.fillStyle='#999';c.fillText(`SIM ${num(state.elapsed,1)}S · ${state.scenario.sensorHealth}% HEALTH`,9,H-10);return;
 }
 const horizon=H*.40;const cx=W*.51;
 const gradient=c.createLinearGradient(0,0,0,H);gradient.addColorStop(0,state.scenario.time==='DAY'?'#26292c':'#101114');gradient.addColorStop(.43,'#111316');gradient.addColorStop(1,'#070809');c.fillStyle=gradient;c.fillRect(0,0,W,H);
 // horizon atmospheric arcs
 c.strokeStyle='#ffffff0a';for(let i=0;i<4;i++){c.beginPath();c.ellipse(cx,horizon+14,W*(.12+i*.12),H*(.035+i*.035),0,Math.PI,Math.PI*2);c.stroke()}
 // grid receding toward horizon
 c.lineWidth=1;c.strokeStyle='#ffffff13';for(let i=-14;i<=14;i++){c.beginPath();c.moveTo(cx+i*W*.018,horizon);c.lineTo(cx+i*W*.075,H);c.stroke()}
 for(let j=0;j<9;j++){let p=j/8,y=horizon+(H-horizon)*p*p;c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
 // simple city silhouettes
 let rr=rng(state.scenario.seed);for(let i=0;i<32;i++){const bw=8+rr()*22,bh=8+rr()*H*.22,x=i*W/29+(rr()-.5)*10,y=horizon-bh*.7;c.fillStyle=i%3===0?'#282a2d':'#1a1c1f';c.fillRect(x,y,bw,bh);c.strokeStyle='#ffffff12';c.strokeRect(x,y,bw,bh);if(state.scenario.time==='DAY'&&i%3===0){c.fillStyle='#777';c.fillRect(x+3,y+4,2,2)}}
 // reference platform and center rings
 c.strokeStyle='#ffffff17';c.beginPath();c.ellipse(cx,H*.69,W*.14,H*.06,0,0,Math.PI*2);c.stroke();c.beginPath();c.ellipse(cx,H*.69,W*.09,H*.04,0,0,Math.PI*2);c.stroke();
 // contacts projected with trails
 state.tracks.forEach((tr,i)=>{let px=cx+tr.x*W*.33,py=horizon+H*.10+tr.z*H*.15+Math.abs(tr.x)*H*.06;const selected=tr.id===state.selected;const size=selected?6:3.2;
   for(let n=3;n>0;n--){c.fillStyle=`rgba(255,255,255,${.025*n})`;c.beginPath();c.arc(px-tr.vx*n*70,py-tr.vz*n*70,size+n*2,0,Math.PI*2);c.fill()}
   c.fillStyle=selected?'#fff':'#d7d9dc';c.beginPath();c.moveTo(px,py-size);c.lineTo(px+size,py);c.lineTo(px,py+size);c.lineTo(px-size,py);c.closePath();c.fill();
   c.strokeStyle=selected?'#fff':'#ffffff55';c.beginPath();c.arc(px,py,size+5+(Math.sin(t*3+i)*1.5),0,Math.PI*2);c.stroke();
   if(selected){c.strokeStyle='#ffffffaa';c.beginPath();c.moveTo(px-15,py);c.lineTo(px-7,py);c.moveTo(px+7,py);c.lineTo(px+15,py);c.moveTo(px,py-15);c.lineTo(px,py-7);c.moveTo(px,py+7);c.lineTo(px,py+15);c.stroke();c.font='9px monospace';c.fillStyle='#fff';c.fillText(tr.id,px+10,py-9)}
 });
 // scan sweep
 c.save();c.translate(cx,H*.66);c.rotate(t*.15);c.beginPath();c.moveTo(0,0);c.arc(0,0,Math.min(W,H)*.33,-.24,.05);c.closePath();c.fillStyle='#ffffff08';c.fill();c.restore();
 c.fillStyle='#96989d';c.font='8px monospace';c.fillText(`${state.scenario.environment} / ${state.scenario.time} / SEED ${state.scenario.seed}`,10,H-10);
}
function paintCanvases(){drawWorld($('#worldCanvas'));drawWorld($('#evidenceCanvas'),'evidence');drawWorld($('#fusionCanvas'),'evidence');drawWorld($('#scenarioCanvas'))}
function frame(nowTime){
 if(state.running&&!state.paused){
   const delta=Math.min(.1,(nowTime-state.lastTick)/1000);state.elapsed+=delta;
   const sec=Math.floor(state.elapsed);
   state.tracks.forEach((t,i)=>{
     t.x+=t.vx*delta;t.z+=t.vz*delta;
     if(Math.abs(t.x)>.9)t.vx*=-1;if(Math.abs(t.z)>.9)t.vz*=-1;
     t.age+=delta;
     // Reproducible confidence variation, driven by simulation time and track index.
     t.confidence=Math.max(18,Math.min(99,Math.round(62+24*Math.sin(state.elapsed*.23+i*.71))));
     if(sec>0&&i%7===0){
       if(sec%24===0){t.seen=false;if(!state.answers[t.id])t.status='UNCERTAIN';}
       if(sec%24===4){t.seen=true;if(!state.answers[t.id])t.status=t.acquired?'ACQUIRED':'REACQUIRED';}
     }
     if(sec>0&&sec%3===0&&t.lastHistorySecond!==sec&&t.history.length<80){t.history.push(t.confidence);t.lastHistorySecond=sec;}
   });
 }
 state.lastTick=nowTime;state.mediaTime=state.mediaPlaying?(state.mediaTime+.016)%8:state.mediaTime;
 paintCanvases();requestAnimationFrame(frame);
}
function start(){
 state.tracks=genTracks(state.scenario);state.selected=state.tracks[0]?.id||null;state.answers={};state.events=[];state.elapsed=0;state.running=true;state.paused=false;state.currentAAR=null;state.lastTick=performance.now();event('SESSION_STARTED',state.scenario.id);go('training');toast('Synthetic training session started');
}
function generate(){
 const name=$('#scenarioName')?.value?.trim()||state.scenario.name;
 const env=$('#env')?.value||state.scenario.environment;const time=$('#time')?.value||state.scenario.time;const seed=Number($('#seed')?.value||Math.floor(Math.random()*999999)+1);
 state.scenario={...state.scenario,name,environment:env,time,seed,visibility:Number($('#visibility')?.value??state.scenario.visibility),sensorHealth:Number($('#health')?.value??state.scenario.sensorHealth),count:Number($('#count')?.value??state.scenario.count),ambiguity:Number($('#ambiguity')?.value??state.scenario.ambiguity),difficulty:$('#difficulty')?.value||state.scenario.difficulty,id:'SCN-'+String(seed).padStart(6,'0')};
 state.tracks=genTracks(state.scenario);state.selected=state.tracks[0]?.id||null;state.answers={};state.running=false;state.paused=false;state.elapsed=0;saveState();render();toast('Scenario generated with seed '+seed);
}
function scoreSession(){
 const assessments=Object.values(state.answers);const classification=assessments.length?Math.round(assessments.filter(a=>a.classification===a.actual).length/assessments.length*100):0;
 const decision=assessments.length?Math.round(assessments.filter(a=>a.decision===a.expected).length/assessments.length*100):0;
 const confidence=assessments.length?Math.max(0,100-Math.round(assessments.reduce((s,a)=>s+Math.abs((a.classification===a.actual?1:0)-a.confidence),0)/assessments.length*100)):0;
 const detection=Math.min(100,Math.round(assessments.length/Math.max(1,state.tracks.length)*100+Math.max(0,20-state.elapsed/10)));
 const continuity=Math.round(state.tracks.reduce((a,t)=>a+t.history.length,0)/Math.max(1,state.tracks.length)*9);
 const completion=state.elapsed>=30?100:Math.min(100,Math.round(state.elapsed/30*100));
 const overall=Math.round(classification*.32+decision*.23+confidence*.15+detection*.15+Math.min(100,continuity)*.08+completion*.07);
 return {overall,classification,decision,confidence,detection,continuity:Math.min(100,continuity),completion,components:{CLASSIFICATION:classification,DECISION:decision,CONFIDENCE:confidence,DETECTION:detection,CONTINUITY:Math.min(100,continuity),COMPLETION:completion}};
}
function finish(){
 if(!state.running&&!state.events.length){toast('Start a session first');return}
 state.running=false;state.paused=false;event('SESSION_COMPLETED','Training session completed');
 const assessments=Object.values(state.answers);
 const session={id:'SES-'+Date.now().toString(36).toUpperCase(),profile:state.profile,scenarioId:state.scenario.id,scenarioName:state.scenario.name,scenario:{...state.scenario},duration:Math.round(state.elapsed),finishedAt:now(),score:scoreSession(),assessmentCount:assessments.length,assessments,events:[...state.events]};
 state.sessions.unshift(session);state.sessions=state.sessions.slice(0,100);state.currentAAR=session.id;state.replayPos=Math.max(0,session.events.length-1);saveState();go('aar');toast('Session saved · AAR ready');
}
function download(filename,data,type='application/json'){
 const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function fileImport(input,callback){input.value='';input.onchange=async()=>{const f=input.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());callback(obj)}catch(e){toast('Import failed: invalid JSON')}};input.click()}
document.addEventListener('click',e=>{
 const tab=e.target.closest('[data-tab]');if(tab){go(tab.dataset.tab);return}
 const select=e.target.closest('[data-select]');if(select){state.selected=select.dataset.select;const t=selectedTrack();if(t){t.acquired=true;t.status='ACQUIRED';event('TRACK_ACQUIRED',t.id)}render();return}
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value;
 if(a==='start')start();
 else if(a==='pause'){state.paused=true;event('SESSION_PAUSED','Paused by trainee');render()}
 else if(a==='resume'){state.paused=false;state.running=true;state.lastTick=performance.now();event('SESSION_RESUMED','Resumed by trainee');render()}
 else if(a==='finish')finish();
 else if(a==='reset-scenario'){if(confirm('Reset current session and regenerate contacts?')){state.running=false;state.paused=false;state.elapsed=0;state.tracks=genTracks(state.scenario);state.selected=state.tracks[0]?.id||null;state.answers={};state.events=[];render();toast('Scenario reset')}} 
 else if(a==='classify'){state.classification=v;render()}
 else if(a==='decision'){state.decision=v;render()}
 else if(a==='sensor'){state.sensor=v;event('SENSOR_CHANGED',v);render()}
 else if(a==='degrade'){state.scenario={...state.scenario,visibility:Math.max(12,state.scenario.visibility-24),sensorHealth:Math.max(18,state.scenario.sensorHealth-28),ambiguity:Math.min(100,state.scenario.ambiguity+12),id:'SCN-DEG-'+uid(),name:state.scenario.name+' / DEGRADED'};state.tracks=genTracks(state.scenario);state.selected=state.tracks[0]?.id||null;saveState();event('SENSOR_CHANGED','Synthetic degradation applied');render();toast('Synthetic sensor quality degraded')}
 else if(a==='submit-answer'){const t=selectedTrack();if(!t){toast('Select a track first');return}t.acquired=true;state.answers[t.id]={trackId:t.id,classification:state.classification,confidence:state.confidence,decision:state.decision,actual:t.actual,expected:t.expected,correct:state.classification===t.actual,t:state.elapsed};event('ASSESSMENT_SUBMITTED',`${t.id}: ${state.classification} / ${state.decision}`);toast('Assessment saved for '+t.id);const next=state.tracks.find(x=>!state.answers[x.id]);if(next)state.selected=next.id;render()}
 else if(a==='focus'){const t=selectedTrack();if(t){t.acquired=true;event('TRACK_FOCUSED',t.id);toast('Camera focus synced to '+t.id)}}
 else if(a==='generate')generate();
 else if(a==='save-scenario'){generate();state.scenarios.unshift({...state.scenario});state.scenarios=state.scenarios.slice(0,40);saveState();render();toast('Scenario saved locally')}
 else if(a==='duplicate-scenario'){generate();state.scenario={...state.scenario,id:'SCN-'+uid(),name:state.scenario.name+' / COPY'};state.scenarios.unshift({...state.scenario});saveState();render();toast('Scenario duplicated')}
 else if(a==='delete-scenario'){state.scenarios.splice(Number(b.dataset.index),1);saveState();render();toast('Scenario deleted')}
 else if(a==='load-scenario'){state.scenario={...state.scenarios[Number(b.dataset.index)]};state.tracks=genTracks(state.scenario);state.selected=state.tracks[0]?.id;saveState();render();toast('Scenario loaded')}
 else if(a==='export-scenario')download('aid-c2s-scenario.json',JSON.stringify({schemaVersion:1,scenario:state.scenario},null,2))
 else if(a==='import-scenario')fileImport($('#scenarioImport'),obj=>{const s=obj.scenario||obj;if(!s||!Number.isFinite(Number(s.seed))||!['URBAN','RURAL','OPEN','INFRASTRUCTURE'].includes(s.environment)||!['DAY','NIGHT','DUSK'].includes(s.time)||!Number.isFinite(Number(s.visibility))||Number(s.visibility)<10||Number(s.visibility)>100||!Number.isFinite(Number(s.sensorHealth))||Number(s.sensorHealth)<15||Number(s.sensorHealth)>100||!Number.isInteger(Number(s.count))||Number(s.count)<4||Number(s.count)>32||!Number.isFinite(Number(s.ambiguity))||Number(s.ambiguity)<0||Number(s.ambiguity)>100)throw new Error('Scenario fields are outside supported bounds');state.scenario={...initialScenario,...s};state.tracks=genTracks(state.scenario);state.selected=state.tracks[0]?.id;saveState();render();toast('Scenario imported and validated')})
 else if(a==='adaptive'){state.scenario={...state.scenario,seed:Math.floor(Math.random()*999999)+1,id:'SCN-ADAPT-'+uid(),name:state.scenario.visibility>55?'LOW VISIBILITY / ADAPTIVE':'CLEAR OBSERVATION / HIGH AMBIGUITY',visibility:state.scenario.visibility>55?38:75,ambiguity:Math.min(90,state.scenario.ambiguity+12),difficulty:'ADAPTIVE'};state.tracks=genTracks(state.scenario);saveState();render();toast('Adaptive scenario generated')}
 else if(a==='media-toggle'){state.mediaPlaying=!state.mediaPlaying;render()}
 else if(a==='media-reset'){state.mediaTime=0;render()}
 else if(a==='open-aar'){state.currentAAR=b.dataset.id;state.replayPos=0;go('aar')}
 else if(a==='replay'){state.replayPos=0;state.replaying=true;render();toast('Replay started')}
 else if(a==='replay-toggle'){state.replaying=!state.replaying;render()}
 else if(a==='replay-step'){const s=state.sessions.find(x=>x.id===state.currentAAR)||state.sessions[0];state.replayPos=Math.max(0,Math.min((s?.events.length||1)-1,state.replayPos+Number(b.dataset.dir)));render()}
 else if(a==='export-aar'){const s=state.sessions.find(x=>x.id===b.dataset.id);if(s)download(`${s.id}-AAR.json`,JSON.stringify(s,null,2));else toast('Session not found')}
 else if(a==='delete-session'){if(confirm('Delete this saved session?')){state.sessions=state.sessions.filter(s=>s.id!==b.dataset.id);saveState();render();toast('Session deleted')}}
 else if(a==='export-backup')download('aid-c2s-phone-backup.json',JSON.stringify({format:'AID-C2S-PHONE-BACKUP',version:1,profile:state.profile,scenario:state.scenario,scenarios:state.scenarios,sessions:state.sessions},null,2))
 else if(a==='import-backup')fileImport($('#backupImport'),obj=>{if(obj.format!=='AID-C2S-PHONE-BACKUP'||!Array.isArray(obj.sessions)||!Array.isArray(obj.scenarios))throw 0;state.profile=String(obj.profile||'DEMO OPERATOR');state.scenario={...initialScenario,...obj.scenario};state.scenarios=obj.scenarios;state.sessions=obj.sessions;saveState();render();toast('Backup imported')})
 else if(a==='reset-demo'){if(confirm('Clear all local demo scenarios, profiles and sessions?')){state.sessions=[];state.scenarios=[];state.profile='DEMO OPERATOR';write('profiles',['DEMO OPERATOR']);state.scenario={...initialScenario};state.tracks=genTracks(state.scenario);state.selected=state.tracks[0].id;state.answers={};state.events=[];state.running=false;state.paused=false;state.elapsed=0;saveState();render();toast('Local demo data reset')}}
 else if(a==='switch-profile'){state.profile=b.dataset.profile;write('profile',state.profile);render();toast('Active profile: '+state.profile)}
 else if(a==='rename-profile'){const old=b.dataset.profile;const val=prompt('New local profile name',old);if(val&&val.trim()){const ps=read('profiles',['DEMO OPERATOR']);const i=ps.indexOf(old);if(i>=0)ps[i]=val.trim().slice(0,28);write('profiles',ps);state.sessions.forEach(s=>{if(s.profile===old)s.profile=val.trim().slice(0,28)});if(state.profile===old)state.profile=val.trim().slice(0,28);saveState();render();toast('Profile renamed')}}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='confidenceRange'){state.confidence=Number(t.value);const l=$('#confLabel');if(l)l.textContent=Math.round(state.confidence*100)+'%'}
 if(t.id==='count'){const l=$('#countLabel');if(l)l.textContent=t.value}
 if(t.id==='visibility'){const l=$('#visLabel');if(l)l.textContent=t.value+'%'}
 if(t.id==='health'){const l=$('#healthLabel');if(l)l.textContent=t.value+'%'}
 if(t.id==='ambiguity'){const l=$('#ambLabel');if(l)l.textContent=t.value+'%'}
 if(t.id==='mediaSeek'){state.mediaTime=Number(t.value);const l=$('#mediaLabel');if(l)l.textContent=state.mediaTime.toFixed(1)+'s'}
 if(t.id==='replayRange'){state.replayPos=Number(t.value);const l=$('#replayLabel');if(l)l.textContent=state.replayPos}
 if(t.id==='historySearch'){state.search=t.value;const pos=t.selectionStart;render();const n=$('#historySearch');if(n){n.focus();n.setSelectionRange(pos,pos)}}
});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='env'||t.id==='time'||t.id==='difficulty'||t.id==='seed'){}});
document.addEventListener('submit',e=>{
 if(e.target.id==='profileForm'){e.preventDefault();const val=$('#newProfile').value.trim();if(!val)return;const ps=read('profiles',['DEMO OPERATOR']);if(ps.some(p=>p.toLowerCase()===val.toLowerCase())){toast('Profile already exists');return}ps.push(val.slice(0,28));write('profiles',ps);state.profile=val.slice(0,28);write('profile',state.profile);render();toast('Profile created')}
});
window.addEventListener('hashchange',()=>{const tab=location.hash.replace(/^#\/?/,'');if(navItems.some(x=>x[0]===tab)&&tab!==state.tab){state.tab=tab;render()}});
window.addEventListener('resize',()=>paintCanvases());
setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);
setInterval(()=>{
 if(state.replaying){
   const s=state.sessions.find(x=>x.id===state.currentAAR)||state.sessions[0];
   if(s&&state.replayPos<s.events.length-1){state.replayPos++;render()}
   else {state.replaying=false;render()}
 }
},650);
render();requestAnimationFrame(frame);
})();
